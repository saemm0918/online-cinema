
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100e0c">
<title>KNZ CINEMA</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#100e0c;color:#eee5d8;
 font-family:Arial,sans-serif;
 min-height:100vh;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);
}
header{
 display:flex;justify-content:space-between;align-items:center;
 padding:22px 2px;border-bottom:1px solid #393027;
}
.logo{font-size:21px;letter-spacing:4px;font-weight:bold}
.status{font-size:10px;color:#b49a73;letter-spacing:1px}
main{max-width:480px;margin:auto}
h1{
 text-align:center;font-size:29px;letter-spacing:5px;
 font-weight:400;margin:38px 0 9px;
}
.sub{text-align:center;color:#9a8874;font-size:10px;letter-spacing:3px}
.screen-wrap{margin:35px 0 27px}
.screen-label{text-align:center;color:#ad9674;font-size:10px;letter-spacing:3px;margin-bottom:12px}
.screen{
 width:100%;aspect-ratio:16/9;background:#211d19;
 border:1px solid #69563e;display:flex;align-items:center;
 justify-content:center;text-align:center;padding:15px;
 box-shadow:0 0 35px #000;
}
.screen span{font-size:11px;letter-spacing:3px;color:#a9957c}
.section-title{font-size:11px;letter-spacing:2px;color:#b49a73;margin:25px 0 14px}
.seats{display:grid;grid-template-columns:repeat(8,1fr);gap:9px}
.seat{
 aspect-ratio:1;border:1px solid #67533b;background:#211d19;
 color:#c8b69c;border-radius:5px;font-size:10px;
}
.seat.selected{background:#a88b60;color:#17120c;border-color:#a88b60}
.seat.taken{opacity:.25}
.info{text-align:center;color:#86796a;font-size:11px;margin:12px 0 25px}
input{
 width:100%;padding:15px;background:#1c1915;
 border:1px solid #514333;color:#eee5d8;
 font-size:14px;outline:none;border-radius:0;
}
.enter{
 width:100%;padding:17px;margin-top:12px;
 background:#a88b60;color:#17120c;border:0;
 letter-spacing:3px;font-weight:bold;font-size:12px;
}
.reaction{text-align:center;margin:30px 0}
.heart{
 background:none;border:1px solid #514333;color:#c9a88d;
 padding:12px 25px;font-size:15px;
}
footer{text-align:center;color:#62574b;font-size:9px;letter-spacing:2px;padding:30px 0}
@media(min-width:600px){
 body{padding-left:30px;padding-right:30px}
}
</style>
</head>
<body>
<header>
 <div class="logo">KNZ</div>
 <div class="status">● CINEMA OPEN</div>
</header>
<main>
 <h1>KNZ CINEMA</h1>
 <div class="sub">NOW SHOWING</div>
 <div class="screen-wrap">
  <div class="screen-label">SCREEN 01</div>
  <div class="screen"><span>THE SHOW WILL BEGIN SOON</span></div>
 </div>
 <div class="section-title">SELECT YOUR SEAT</div>
 <div class="seats" id="seats"></div>
 <div class="info" id="seatInfo">PLEASE SELECT A SEAT</div>
 <input id="nickname" placeholder="ENTER YOUR NICKNAME" maxlength="15">
 <button class="enter" onclick="enterCinema()">ENTER CINEMA</button>
 <div class="reaction">
  <button class="heart" onclick="like()">♡ <span id="likes">0</span></button>
 </div>
</main>
<footer>KNZ CINEMA · EST. 2026</footer>
<script>
let selected=null,likes=0;
const seats=document.getElementById('seats');
for(let i=1;i<=32;i++){
 const b=document.createElement('button');
 b.className='seat';b.textContent=String(i).padStart(2,'0');
 b.onclick=()=>{
  document.querySelectorAll('.seat').forEach(x=>x.classList.remove('selected'));
  b.classList.add('selected');selected=i;
  document.getElementById('seatInfo').textContent='YOUR SEAT : '+String(i).padStart(2,'0');
 };
 seats.appendChild(b);
}
function enterCinema(){
 const name=document.getElementById('nickname').value.trim();
 if(!selected)return alert('PLEASE SELECT YOUR SEAT');
 if(!name)return alert('PLEASE ENTER YOUR NICKNAME');
 alert('WELCOME TO KNZ CINEMA, '+name+'!');
}
function like(){
 likes++;document.getElementById('likes').textContent=likes;
}
</script>
</body>
</html>
